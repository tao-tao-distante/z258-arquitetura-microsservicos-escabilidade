map $uri $cache_control {
    default "no-store";
    ~*\.(?:css|js|woff2?|png|jpe?g|gif|svg|ico)$ "public, max-age=31536000, immutable";
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream identity_backend {
    zone identity_backend 64k;
    least_conn;
    server service-identity:8080 resolve;
}

upstream task_backend {
    zone task_backend 64k;
    least_conn;
    server service-task:8080 resolve;
}

upstream notification_backend {
    zone notification_backend 64k;
    least_conn;
    server service-notification:8080 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
    }

    location ~ ^/api/(?:identity|tasks|notifications)/metrics/?$ {
        return 404;
    }

    location /api/identity/ {
        include /etc/nginx/security-headers.conf;
        add_header X-Trace-ID $otel_trace_id always;
        otel_trace on;
        otel_trace_context inject;
        proxy_pass http://identity_backend/;
    }

    location /api/tasks/ {
        include /etc/nginx/security-headers.conf;
        add_header X-Trace-ID $otel_trace_id always;
        otel_trace on;
        otel_trace_context inject;
        proxy_pass http://task_backend/;
    }

    location /api/notifications/ {
        include /etc/nginx/security-headers.conf;
        add_header X-Trace-ID $otel_trace_id always;
        otel_trace on;
        otel_trace_context inject;
        proxy_pass http://notification_backend/;
    }
}
