map $uri $cache_control {
    default "no-store";
    ~*\.(?:css|js|woff2?|png|jpe?g|gif|svg|ico)$ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Cache-Control $cache_control always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
    }

    location /api/identity/ {
        proxy_pass http://service-identity:8080/;
    }

    location /api/tasks/ {
        proxy_pass http://service-task:8080/;
    }

    location /api/notifications/ {
        proxy_pass http://service-notification:8080/;
    }
}
