global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: service-identity
    metrics_path: /metrics
    static_configs:
      - targets: [service-identity:8080]

  - job_name: service-task
    metrics_path: /metrics
    static_configs:
      - targets: [service-task:8080]

  - job_name: service-notification
    metrics_path: /metrics
    static_configs:
      - targets: [service-notification:8080]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: [rabbitmq:15692]
