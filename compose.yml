services:
  postgres-identity:
    image: postgres:15.18
    restart: unless-stopped
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${POSTGRES_IDENTITY_PASSWORD:?set POSTGRES_IDENTITY_PASSWORD in .env}
      POSTGRES_DB: identity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    networks:
      - identity-data

  postgres-task:
    image: postgres:15.18
    restart: unless-stopped
    environment:
      POSTGRES_USER: task
      POSTGRES_PASSWORD: ${POSTGRES_TASK_PASSWORD:?set POSTGRES_TASK_PASSWORD in .env}
      POSTGRES_DB: task
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-task-data:/var/lib/postgresql/data
    networks:
      - task-data

  rabbitmq:
    image: rabbitmq:4.2.7-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - messaging

  tempo:
    image: grafana/tempo:3.1.1
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - telemetry

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - telemetry

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - telemetry

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./provisioning/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - telemetry

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    init: true
    ports:
      - "8081:80"
    depends_on:
      service-identity:
        condition: service_healthy
      service-task:
        condition: service_healthy
      service-notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge

  service-identity:
    build:
      context: .
      dockerfile: service-identity/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres-identity:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://identity:${POSTGRES_IDENTITY_PASSWORD:?set POSTGRES_IDENTITY_PASSWORD in .env}@postgres-identity:5432/identity?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - identity-data
      - telemetry

  service-task:
    build:
      context: .
      dockerfile: service-task/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      postgres-task:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://task:${POSTGRES_TASK_PASSWORD:?set POSTGRES_TASK_PASSWORD in .env}@postgres-task:5432/task?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - task-data
      - messaging
      - telemetry

  service-notification:
    build:
      context: .
      dockerfile: service-notification/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      PORT: "8080"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
      - messaging
      - telemetry

volumes:
  postgres-identity-data:
  postgres-task-data:
  rabbitmq-data:
  tempo-data:
  prometheus-data:
  grafana-data:

networks:
  edge:
  identity-data:
    internal: true
  task-data:
    internal: true
  messaging:
    internal: true
  telemetry:
    internal: true
